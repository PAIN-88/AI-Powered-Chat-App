{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'chat/user_list.css' %}">

<div class="user-wrapper">

    <div class="user-header">

        <div>
            <h2>Start a New Chat</h2>
            <p>Select a user to begin chatting</p>
        </div>

        <a href="{% url 'inbox' %}" class="back-btn">
            ← Back to Inbox
        </a>

    </div>

    <div class="user-card">

        {% for u in users %}

        <div class="user-row">

            <div class="user-info">

                <div class="avatar">
                    {{ u.username|first|upper }}
                </div>

                <div>

                    <div class="username">
                        {{ u.username }}
                    </div>

                    <div class="status">
                        Available
                    </div>

                </div>

            </div>

            <a href="{% url 'start_chat' u.id %}" class="chat-btn">
                Start Chat
            </a>

        </div>

        {% empty %}

        <div class="empty-users">

            No other users found.

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
