{% extends 'base.html' %}
{% load static %}

{% block content %}
 <link rel="stylesheet" href="{% static 'ai_app/ai_chat.css' %}?v=6">
<div class="ai-window">
    <div class="ai-window-header">
        <div class="ai-window-dots">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
        </div>
        <div class="ai-window-title">AI Assistant</div>
        <div class="ai-window-status">
            <span class="status-dot"></span> Online
        </div>
    </div>

    <div id="ai-chat-log" class="ai-window-body">
        {% for msg in history %}
            <div class="ai-row {% if msg.role == 'user' %}ai-row-user{% else %}ai-row-ai{% endif %}">
                <div class="ai-bubble {% if msg.role == 'user' %}bubble-user{% else %}bubble-ai{% endif %}">
                    {{ msg.content }}
                </div>
            </div>
        {% endfor %}
    </div>

    <div class="ai-window-input">
        <input type="text" id="ai-message-input" placeholder="Ask AI anything...">
        <button id="ai-send-btn">➜</button>
    </div>
</div>

<script>
    function appendMessage(role, text) {
        const chatLog = document.querySelector('#ai-chat-log');
        const row = document.createElement('div');
        row.className = `ai-row ${role === 'user' ? 'ai-row-user' : 'ai-row-ai'}`;
        const bubble = document.createElement('div');
        bubble.className = `ai-bubble ${role === 'user' ? 'bubble-user' : 'bubble-ai'}`;
        bubble.innerText = text;
        row.appendChild(bubble);
        chatLog.appendChild(row);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    document.querySelector('#ai-send-btn').onclick = function() {
        const input = document.querySelector('#ai-message-input');
        const message = input.value;
        if (!message.trim()) return;

        appendMessage('user', message);
        input.value = '';

        fetch("{% url 'ai_chat' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({ message: message })
        })
        .then(response => response.json())
        .then(data => {
            appendMessage('ai', data.reply);
        });
    };

    document.querySelector('#ai-message-input').onkeyup = function(e) {
        if (e.key === 'Enter') {
            document.querySelector('#ai-send-btn').click();
        }
    };
</script>
{% endblock %}
